[build]
system = "x86_64-pc-linux-gnu"
prefix = "/opt/nsh-bash-5.3.15"
configure_args = [
    "--prefix=/opt/nsh-bash-5.3.15",
    "--without-bash-malloc",
    "--disable-nls",
]
cc = "/usr/bin/cc"
cflags_template = "-O2 -g0 -ffile-prefix-map={output}=/usr/src/bash-5.3.15"
make_args = [
    "-s",
    "-j2",
]
source_date_epoch = 1753833600

[build.environment]
HOME = "{output}/home"
LC_ALL = "C"
PATH = "/usr/bin:/bin"
TZ = "UTC"

[build.tools]
cc = "cc (Debian 14.2.0-19) 14.2.0"
make = "GNU Make 4.4.1"
tar = "tar (GNU tar) 1.35"
patch = "GNU patch 2.8"
bison = "bison (GNU Bison) 3.8.2"
libc = "ldd (Debian GLIBC 2.41-12+deb13u3) 2.41"

[execution]
kernel = "Linux 6.12.100+deb13-amd64 x86_64"
containment = "sandbox-pid-net-ro-root"
locale = "C.UTF-8"
timezone = "UTC"
base_path = "/usr/bin:/bin"
environment_is_cleared = true
unset = [
    "BASH_ENV",
    "ENV",
    "HOME",
]

[execution.environment]
LC_ALL = "C.UTF-8"
LOCALE_ARCHIVE = ""
OILS_GC_ON_EXIT = ""
PATH = "{fixture-bin}:/usr/bin:/bin"
REPO_ROOT = "{fixture-root}"
SH = "{oracle-binary}"
TMP = "{case-scratch}"
TZ = "UTC"

