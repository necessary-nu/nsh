# Bash-mode disposition register.
#
# The survey can express Bash's defects -- `## BUG bash` in the corpus,
# `known_bug` in the runner -- but has no counterpart for ours. Without one,
# a case refused on purpose reports as a plain FAIL, indistinguishable from
# one nobody has implemented. This file is that counterpart, and
# `nsh-survey gate-bash` reads it.
#
# Categories, in the order they matter:
#
#   not-implemented       Nobody has built it. An honest backlog entry, and
#                         the only category that may grow by accident. It is
#                         deliberately not a synonym for the next one.
#   defect                A bug in this shell with a known reproduction, as
#                         opposed to a feature that was never written.
#   sanctioned-divergence We refuse Bash's behaviour on purpose. Every entry
#                         names the reason and, where the difference is
#                         observable outside the survey, has a prose entry in
#                         docs/divergences.md.
#   harness-artifact      The case cannot pass for any shell under this
#                         runner, so it says nothing about the shell.
#   out-of-contract       Outside the profile per
#                         [dec:nsh:bash-compatibility-is-scripts].
#
# Bash's own defects are not recorded here: the corpus qualifies them and the
# runner reports them as `known-bug`, and the reference calibration in
# BASH_REFERENCE_CASES.json carries a disposition for every case the pinned
# Bash 5.3 build does not itself pass.
#
# The gate is symmetric. A registered case that starts passing is a stale
# entry and fails the gate, exactly as an unregistered case that stops
# passing does.

schema = 1
group = "bash-extension"
oils_commit = "15de8fd779569e6e3a9f5fcbfc00e7df0ebe0380"

# Whole files the scope decision removes from the contract. Excluded is not
# ignored: the reason is recorded here and the gate reports the count.

[[scope]]
spec = "prompt.test.sh"
disposition = "out-of-contract"
reason = "Prompt rendering. Retired from the profile by [dec:nsh:bash-compatibility-is-scripts]; Bash mode is a contract about what a Bash script means, not about what the shell looks like to a person."

