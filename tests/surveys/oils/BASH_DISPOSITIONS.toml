disposition = "not-implemented"
reason = "A suffix operator or an `@`-transform applied through `${a[*]}` is applied to the joined string; Bash applies it to each element and joins afterwards."

[[case]]
id = "toysh.test.sh:6"
disposition = "not-implemented"
reason = "Here-strings (`<<<`) are not implemented at all: `cat <<< text` is a syntax error. This is a plain gap in the Bash redirection grammar."

[[case]]
id = "type-compat.test.sh:1"
disposition = "not-implemented"
reason = "`declare -i` evaluates a plain assignment but not an append: `i+=' 2 '` concatenates the text where Bash adds arithmetically."

[[case]]
id = "type-compat.test.sh:4"
disposition = "not-implemented"
reason = "The declaration built-ins do not re-parse an operand that arrived as one word, so `declare -a 'x=(1 2)'`, `typeset -a \"$code\"` and `$myvar x=$x` store the text rather than the assignment it spells."

[[case]]
id = "unicode.test.sh:3"
disposition = "sanctioned-divergence"
reason = "`\\uXXXX`/`\\UXXXXXXXX` above U+10FFFF produce no bytes; Bash encodes the value anyway, yielding a byte sequence that is not UTF-8 for any character. Refusing to manufacture it is deliberate (`crates/nsh/src/escape.rs::unicode_bytes`); the refusal is silent, which is a wart the entry records rather than hides."

