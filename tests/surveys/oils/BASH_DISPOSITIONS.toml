# One entry per eligible in-scope case that does not pass.

[[case]]
id = "append.test.sh:14"
disposition = "not-implemented"
reason = "A declaration built-in does not accept a name built by expansion with `+=`, so `typeset s${dyn}+=foo` and `export NAME${suffix}+=value` do not append."

[[case]]
id = "arith-context.test.sh:15"
disposition = "not-implemented"
reason = "An empty subscript `a[]=v` is accepted and assigns index 0, and `${a[]}` reads it; Bash rejects both as a bad substitution. Nothing validates that a subscript has an expression in it, and the rejection also needs Bash's error boundary: Bash reports each line and carries on with status 1."

[[case]]
id = "array-compat.test.sh:1"
disposition = "defect"
reason = "`\"$@\"` embedded in a larger word joins its fields with the first byte of `IFS`; every shell joins with a space there, and this reproduces with the dialect off."

[[case]]
id = "array-sparse.test.sh:31"
disposition = "out-of-contract"
reason = "`compgen` is part of the programmable-completion surface retired by [dec:nsh:bash-compatibility-is-scripts]; there is no `complete`/`compgen`/`compopt` and reporting one would advertise a facility that is not here."

[[case]]
id = "builtin-read.test.sh:26"
disposition = "defect"
reason = "Field splitting drops the text after a backslash-protected run: `printf '\\a \\b\\n' | read line` yields `a` where every shell yields the whole line. Reproduces with the dialect off, so this is a POSIX-mode defect rather than a Bash gap. Filed on this node on 2026-08-22."

[[case]]
id = "builtin-trap-err.test.sh:12"
disposition = "not-implemented"
reason = "Bash raises `ERR` for `{ false; } &` and not for `false &`, because it forks an asynchronous *simple* command below the point the condition is raised and a compound one above it. This tree does not keep the braces -- `{ list; }` parses to the list itself -- so the two forms are the same node here and the trap runs for both."

[[case]]
id = "builtin-type-bash.test.sh:3"
disposition = "not-implemented"
reason = "`time` is not in the grammar, so `type -t time` reports nothing. Naming it a keyword while `time echo hi` is a command that is not found would advertise a grammar this shell does not have, so the gap is the reserved word rather than the classification. `select` is absent for the same reason and this case does not reach it."

[[case]]
id = "nix-idioms.test.sh:4"
disposition = "not-implemented"
reason = "A declaration built-in does not accept a name built by expansion with `+=`, so `typeset s${dyn}+=foo` and `export NAME${suffix}+=value` do not append."

[[case]]
id = "toysh.test.sh:6"
disposition = "not-implemented"
reason = "`{name}<word` is not implemented: Bash allocates a descriptor above 9 and stores its number in `name`, and this shell has no redirection that names a variable. Here-strings themselves work."

[[case]]
id = "unicode.test.sh:3"
disposition = "sanctioned-divergence"
reason = "`\\uXXXX`/`\\UXXXXXXXX` above U+10FFFF produce no bytes; Bash encodes the value anyway, yielding a byte sequence that is not UTF-8 for any character. Refusing to manufacture it is deliberate (`crates/nsh/src/escape.rs::unicode_bytes`); the refusal is silent, which is a wart the entry records rather than hides."

[[case]]
id = "unicode.test.sh:5"
disposition = "sanctioned-divergence"
reason = "`\\uXXXX`/`\\UXXXXXXXX` above U+10FFFF produce no bytes; Bash encodes the value anyway, yielding a byte sequence that is not UTF-8 for any character. Refusing to manufacture it is deliberate (`crates/nsh/src/escape.rs::unicode_bytes`); the refusal is silent, which is a wart the entry records rather than hides."

[[case]]
id = "var-op-bash.test.sh:24"
disposition = "sanctioned-divergence"
reason = "An associative array iterates in sorted key order where Bash iterates in its hash order, so `${A[@]}` and `${A[*]}` list the same elements in a different order. The operator order this case also tests is implemented -- `@Q` applies per element and joins afterwards -- and only the ordering differs. Matching Bash would mean reproducing its hash function, which is not a claim about what a script means; a deterministic order is. Recorded in docs/divergences.md."

