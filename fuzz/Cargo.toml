# Its own workspace on purpose: libFuzzer needs a nightly toolchain and a
# `-Z` sanitizer flag, and the shell itself must keep building on stable.
# Nothing here ships.
[workspace]

[package]
name = "nsh-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = { version = "0.4", features = ["arbitrary-derive"] }
bstr = "1"

[dependencies.nsh]
path = "../crates/nsh"
features = ["fuzzing"]

[[bin]]
name = "parse"
path = "fuzz_targets/parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "matcher"
path = "fuzz_targets/matcher.rs"
test = false
doc = false
bench = false

[[bin]]
name = "quoting"
path = "fuzz_targets/quoting.rs"
test = false
doc = false
bench = false

[[bin]]
name = "differential"
path = "fuzz_targets/differential.rs"
test = false
doc = false
bench = false

[[bin]]
name = "roundtrip"
path = "fuzz_targets/roundtrip.rs"
test = false
doc = false
bench = false

[[bin]]
name = "field_split"
path = "fuzz_targets/field_split.rs"
test = false
doc = false
bench = false

[[bin]]
name = "arithmetic"
path = "fuzz_targets/arithmetic.rs"
test = false
doc = false
bench = false

[[bin]]
name = "parameter"
path = "fuzz_targets/parameter.rs"
test = false
doc = false
bench = false

[[bin]]
name = "printf"
path = "fuzz_targets/printf.rs"
test = false
doc = false
bench = false

[[bin]]
name = "redirection"
path = "fuzz_targets/redirection.rs"
test = false
doc = false
bench = false

[profile.release]
debug = true
