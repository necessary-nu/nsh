[package]
name = "dash"
version = "0.5.13"
edition.workspace = true
license.workspace = true
description = "Debian Almquist Shell — Rust port"

[lib]
name = "dash"
path = "src/lib.rs"

[[bin]]
name = "dash"
path = "src/main.rs"

[dependencies]
libc = "0.2"
nshedit = { git = "ssh://git@github.com/necessary-nu/nshedit.git", branch = "main" }
