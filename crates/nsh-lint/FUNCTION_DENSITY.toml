# Function-density register: the files close enough to the cap that the
# next person adding to one should know what the answer is before they
# start.
#
# `[spec:np:req:dod.function-density]` caps a staged file at fifty
# functions, and it charges *growth* rather than level: a file already at
# fifty costs nothing until somebody adds to it, and then it costs a split
# -- presented as a refused commit, during whatever change happened to
# arrive. That was five bugfixes in a row in the week of 2026-08-25, and
# eight files sitting on exactly fifty is the shape of an attractor rather
# than of a distribution.
#
# So the bill is presented five functions early. A file at or above the
# mark must have an entry here, and `nsh-lint` fails until it does.
# Registering costs one line and a sentence; what it buys is that the
# decision gets made with five functions of headroom instead of none.
#
# The register is symmetric, exactly as `BASH_DISPOSITIONS.toml` is: a
# registered file that has fallen back below the mark fails until its
# entry is deleted. Without that half a register is a place to hide, and
# an entry outlives the file it was written about.
#
# AN ENTRY'S `answer` SAYS WHAT TO DO, not that the file is large -- the
# check already knows the file is large. Name the seam to split along, or
# the helpers to fold, or say that the file is right as it is and why. An
# answer like "it is big" is worthless: these entries are the plan the
# next person inherits, and they are read at the moment somebody wants to
# add a function and has to decide what to do instead.
#
# AN ANSWER IS A PREDICTION, AND EVERY ONE WRITTEN SO FAR WAS WRONG
# SOMEWHERE. Naming a seam is a claim about the code on *both* sides of
# it, and the first five entries here were written from the half that
# moves. Each was found by the person who acted on it:
#
#   * `arithmetic.rs` predicted "a `pub(super)` on two types and nothing
#     else". It was four types and eight annotations. `Name` and `Lexer`
#     were listed among the things that move and are also used by what
#     stays -- the parser takes `Name` in three signatures and builds a
#     `Lexer` in `Parser::new` -- and `Name`'s two fields are read at
#     eight sites, so the type alone would not have been enough. The
#     closing "neither of which it constructs" was false as well:
#     `Parser::power` constructs a `BinaryOperator`.
#
#   * `printf.rs` said "nothing else in the file calls them except the
#     two `Operands` accessors". `run` calls `leading_number` twice, in
#     the width and precision branches of the format walk, so the seam is
#     three `pub(super)` and not two. Its arithmetic was short as well,
#     omitting the two test helpers that have to travel with the tests
#     they serve: 22 functions left, not the 23 predicted.
#
#   * `nsh-platform/src/locale.rs` was measured at 49 and is 41. Eight of
#     its declarations sit inside an `unsafe extern "C"` block, which the
#     gate does not count. It never became an entry at all, and only
#     because the figure was checked before this file was written.
#
# None of those made an entry useless -- every seam was in the right
# place, and all five splits landed. But an entry that is wrong about
# what crosses the boundary understates the work, and the numbers being
# right is no evidence that the prose is: the first two were wrong in
# prose alone.
#
# So write the answer from the code that *stays* as much as from the code
# that goes, count with `density.rs`'s counter rather than by eye, and if
# you are picking an entry up, verify it rather than trust it. That is
# what caught all three.
#
# COUNTED THE WAY THE GATE COUNTS. `exempt-test-scope` is false, so a
# file's own `mod tests { ... }` counts against the same fifty as its
# code; a `mod tests;` in a file of its own does not. The unit is one
# file, not one module -- unlike every other check in this crate, which
# reads a module as its file plus the directory beside it, because the
# gate's unit is the staged file.

schema = 1

# The function count at which an entry becomes required. Repeated from
# `density.rs` so the file says what it means, and checked against it so
# the two cannot drift.
mark = 45

# The cap the register gives warning of, from
# `.config/nplan/config.styx`: `function-density {max-per-file 50}`.
cap = 50

[[file]]
path = "crates/nsh/src/parser/bash.rs"
answer = """
Split the conditional sub-grammar out to `crates/nsh/src/parser/bash/conditional.rs`. \
Eleven functions move -- `conditional`, `conditional_expression`, `conditional_chain`, \
`conditional_or`, `conditional_and`, `conditional_primary`, `conditional_test`, \
`closes_conditional`, `unary_operator`, `binary_operator`, `matches_a_pattern` -- with the \
`ConditionalExpression` struct they pass between them, leaving 35 functions here and 11 there. \
TWO THINGS CROSS THE SEAM AND HAVE TO STAY: `take_word` and the `ConditionalWord` it returns \
are also used by `compound_array` for an array element, so the new module takes both from \
`super` rather than taking them with it. `command_prefix` keeps calling `conditional`, which \
stays `pub(super)`, and `conditional_primary` keeps reaching `super::keywords::nested` and \
`super::tokens::mark`, so the move is imports and no signature changes. Counted with \
`density.rs`'s counter on 2026-09-02, the day the file reached 46 by gaining `conditional_chain` \
and `conditional_test` for the `[[ ]]` newline work.
"""


[[file]]
path = "crates/nsh-platform/src/locale.rs"
answer = """
Split the character half out to `crates/nsh-platform/src/locale/characters.rs`: everything \
that answers "what character do these bytes spell, and what is it". Thirteen functions move -- \
`LocaleDecoder::push`, and `Locale`'s `decoder`, `decode_byte`, `decode_prefix`, \
`wide_is_blank`, `wide_is_space`, `charmap_is_utf8`, `encode_character`, `multibyte_len`, \
`character_widths`, `decode_exact`, `wide_class_matches` and `wide_chars` -- with the \
`LocaleDecode`, `LocaleCharacter` and `LocaleDecoder` types, both spellings of `MbState`, and \
the whole `unsafe extern "C"` block: all eight of its declarations are called only from this \
set, so none of them stays behind. Seven tests go with them -- `a_charmap_answers_for_its_own_characters`, \
`a_value_beyond_wchar_is_refused`, `encoding_preserves_thread_locale`, \
`character_widths_answer_every_byte_position`, `character_widths_preserve_thread_locale`, \
`decoder_keeps_locale_handle_alive`, and the `utf8()` helper, which four of them use and \
nothing that stays does. That is 20 moving and 32 left here. \
WHAT CROSSES THE SEAM AND STAYS: `Locale`, `RawLocale`, `select` and `with_selected`. Every \
moved function opens with `self.with_selected(...)` and several read `self.0.handle`, and a \
child module sees its parent's private items, so the new file takes all four from `super` and \
no visibility changes. `LocaleGuard` and its `Drop` stay with them. `ByteClass`, \
`byte_classes` and the three `is_alpha`/`is_alphanumeric`/`is_space` stay too, and are not a \
near miss: they ask `libc::isalpha` and never touch the extern block, which is why the block \
can move whole. \
ONE RE-EXPORT CROSSES AND IS EASY TO MISS: `crates/nsh-platform/src/unix.rs` names \
`pub use locale::{Locale, LocaleCategory, LocaleCharacter, LocaleDecode, LocaleDecoder}`, so \
`locale.rs` gains a `pub use characters::{LocaleCharacter, LocaleDecode, LocaleDecoder}` or \
`unix.rs` is retyped. `crates/nsh-platform/src/lib.rs`'s `Locale::character_encoding` calls \
`encode_character`, which is `pub(crate)` and stays `pub(crate)` wherever it lives, so `lib.rs` \
is untouched -- but `a_charmap_answers_for_its_own_characters` tests `character_encoding` and \
not anything in this file, and belongs beside `encode_character` rather than where it is. \
`crates/nsh-platform/src/windows/locale.rs` is a file of its own and is unaffected. \
Counted with `density.rs`'s counter on 2026-09-03, the day merging `origin/master` took the \
file from 45 to 52 -- over the cap -- by landing `4cc143b`'s `[ByteClass; 256]` table beside \
this tree's `decode_prefix`. The split is not done: this is the plan, and the merge that \
required it recorded a `function-density` bypass rather than restructure a file two \
histories had just met inside.
"""
