[package]
name = "nsh"
version = "0.5.13"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "A POSIX shell as a library"

[lib]
name = "nsh"
path = "src/lib.rs"

[features]
api-sketch = []

[dependencies]
bstr = "1"
libc = "0.2"
nshedit = { git = "ssh://git@github.com/necessary-nu/nshedit.git", branch = "main" }

[[example]]
name = "embed"
required-features = ["api-sketch"]
