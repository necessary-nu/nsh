[package]
name = "nsh"
version = "0.5.13"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "A POSIX shell as a library"

[lib]
name = "nsh"
path = "src/lib.rs"

[dependencies]
bstr = "1"
nsh-platform = { path = "../nsh-platform" }
nshedit = { git = "https://github.com/necessary-nu/nshedit.git", rev = "8059f66ee3a22e699b65dc60beaa4be933588d60" }
nshedit-plat = { git = "https://github.com/necessary-nu/nshedit.git", rev = "8059f66ee3a22e699b65dc60beaa4be933588d60" }
nshterm = { git = "https://github.com/necessary-nu/nshedit.git", rev = "8059f66ee3a22e699b65dc60beaa4be933588d60" }

[[example]]
name = "embed"
